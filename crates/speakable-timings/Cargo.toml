[package]
name = "speakable-timings"
description = "Sentence timings for a markdown document and one recording of it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3"
speakable-markdown = { path = "../speakable-markdown", version = "0.1.0" }

[dev-dependencies]
speakable-splitter = { path = "../speakable-splitter" }
