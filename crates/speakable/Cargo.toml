[package]
name = "speakable"
description = "Command-line tools for sentence timings and demo pages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "speakable"
path = "src/main.rs"

[features]
default = ["align"]
# `align` and `demo --audio`: forced alignment, which brings in the model
# runtime (candle) and downloads the model on first use.
align = ["dep:speakable-align"]
metal = ["align", "speakable-align/metal"]
cuda = ["align", "speakable-align/cuda"]

[dependencies]
clap = { version = "4", features = ["derive"] }
speakable-align = { workspace = true, optional = true }
speakable-markdown.workspace = true
speakable-normalizer.workspace = true
speakable-timings.workspace = true
